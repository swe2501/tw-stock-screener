<style>.painted-habitat{position:absolute;inset:0;z-index:-1;background-image:url(/world-atlas.png);background-size:306% 306%;background-repeat:no-repeat;filter:saturate(.80) brightness(.95)}.painted-habitat:after{content:"";position:absolute;inset:0;background:linear-gradient(#fff2d31a,#284c3b05 65%,#263e3222)}.camera-views{position:absolute;z-index:2;right:14px;top:14px;display:flex;gap:4px;padding:4px;border:1px solid #ffffff88;border-radius:99px;background:#ffffffa8;backdrop-filter:blur(8px)}.camera-views button{border:0;background:transparent;color:#456457;border-radius:99px;padding:5px 11px;font-size:11px}.camera-views button[aria-pressed=true]{background:#315b50;color:white}</style>
<main><header><div><div class="eyebrow">MARKET ACADEMY · COMPANION ATELIER</div><h1>九段旅程，慢慢長成。</h1><p>選擇旅伴，看看不同外觀與成長階段。</p></div><div class="progress" id="progress">正在整理角色…</div></header>
<nav class="themes" aria-label="選擇角色"></nav><div class="workspace"><section class="stage"><div class="stage-top"><div><h2 id="title">韭菜成仙</h2><div class="scene-name" id="scene-name"></div></div><div class="personas" role="group" aria-label="角色外觀"><button data-persona="female">女</button><button data-persona="male">男</button><button data-persona="neutral" aria-pressed="true">中性</button></div></div><div id="view"><div id="loading" role="status">正在迎接旅伴…</div><div class="hint">拖曳轉動視角 · 滾輪縮放</div></div><div class="evolution" role="group" aria-label="進化階段"></div><div class="controls" role="group" aria-label="角色互動"></div><div id="caption" role="status">每次互動結束後，角色會回到待機。</div></section><aside><div class="card reference"><h3>角色原畫</h3><img id="reference" alt="目前角色與階段的原畫參考"><small>右側原畫供比對；立體造型為本機製作的新版本。</small></div><div class="card details"><h3>這位旅伴</h3><div><span>外觀</span><strong id="persona-name">中性</strong></div><div><span>階段</span><strong id="stage-name"></strong></div><div><span>場景</span><strong id="habitat-name"></strong></div><div><span>互動動作</span><strong>5 種</strong></div></div><div class="note">目前是造型工作稿，尚未完成美術精修。花園狐正重做比例、材質與服裝；其餘角色仍需逐項精修。</div></aside></div></main>
<script type="module">
import * as T from './vendor/three-0.180.0/three.module.min.js';
import {GLTFLoader} from './vendor/three-0.180.0/GLTFLoader.js';
import {createHabitat,habitats} from './companion-cast-scenes.js';
const themes={immortal:'韭菜成仙',garden:'心願花園',mountain:'登峰之旅',space:'星際旅程',castle:'夢想城堡',pet:'陪伴小獸',ocean:'珊瑚海洋',gem:'光之晶石',train:'夢想列車'};
const stages={immortal:['萌芽初見','啟程修習','凝心蛻變','御風將成','化境成仙'],garden:['種下心願','嫩芽初長','枝葉舒展','花苞待放','繁花成園'],mountain:['山腳出發','準備裝備','踏上山徑','攀越稜線','登峰遠望'],space:['仰望星空','訓練啟程','打造飛船','穿越星海','探索新世界'],castle:['幼龍基石','第一塔樓','城牆漸成','守護家園','夢想王國'],pet:['初遇幼獸','安心陪伴','一起長大','羽翼初成','守護夥伴'],ocean:['小龜初生','游向淺海','珊瑚萌生','海洋花園','守護珊瑚海'],gem:['晶石微光','幼龍相伴','晶簇生長','光芒綻放','星晶守護者'],train:['小小車頭','整裝待發','加上車廂','穿越山谷','夢想車站']};
const labels={pat:'輕輕摸摸',offer:'分享點心',play:'一起跳舞',care:'輕柔照料',cheer:'碰手打氣'};
const $=s=>document.querySelector(s),host=$('#view'),loading=$('#loading');
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;host.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.05,80),key=new T.DirectionalLight('#fff0d0',2.4),fill=new T.HemisphereLight('#edf3f3','#586457',2.5),rim=new T.DirectionalLight('#c4dfdf',1.7);key.position.set(-3,5,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-3,right:3,top:4,bottom:-2,near:.1,far:20});key.shadow.bias=-.0003;key.shadow.radius=4;rim.position.set(3,3,-3);scene.add(key,fill,rim);
let environment=null,environmentTheme='';
let selected={theme:'garden',persona:'neutral',stage:0},index=new Map(),model=null,mixer=null,active=null,clips={},habitat=null,request=0,last=0,time=0,frame=0,drag=null,yaw=.25,pitch=.12,distance=5.4,destroyed=false,abort=null;
const painted=document.createElement('div');painted.className='painted-habitat';painted.setAttribute('aria-hidden','true');host.prepend(painted);
const cameraViews=document.createElement('div');cameraViews.className='camera-views';cameraViews.setAttribute('role','group');cameraViews.setAttribute('aria-label','檢查立體角度');
for(const [label,angle]of [['正面',0],['側面',Math.PI/2],['背面',Math.PI]]){const b=document.createElement('button');b.textContent=label;b.dataset.angle=angle;b.onclick=()=>{yaw=angle;for(const x of cameraViews.children)x.setAttribute('aria-pressed',String(x===b));draw();};cameraViews.append(b);}host.append(cameraViews);
const reduced=matchMedia('(prefers-reduced-motion:reduce)'),loader=new GLTFLoader();
function dispose(root){const gs=new Set(),ms=new Set(),ts=new Set();root?.traverse(o=>{if(o.geometry)gs.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material])if(m){ms.add(m);for(const value of Object.values(m))if(value?.isTexture)ts.add(value);}});for(const g of gs)g.dispose();for(const t of ts){t.dispose();t.source?.data?.close?.();}for(const m of ms)m.dispose();}
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();draw();}new ResizeObserver(resize).observe(host);
function draw(){camera.position.set(Math.sin(yaw)*distance,.20+Math.sin(pitch)*distance,Math.cos(yaw)*distance);camera.lookAt(0,.15,0);renderer.render(scene,camera);}
function play(name){if(!mixer||!clips[name])return;const next=mixer.clipAction(clips[name]);next.reset().setEffectiveWeight(1).setEffectiveTimeScale(1).setLoop(name==='idle'?T.LoopRepeat:T.LoopOnce,name==='idle'?Infinity:1);next.clampWhenFinished=name!=='idle';next.play();if(active&&active!==next)next.crossFadeFrom(active,.20,false);active=next;document.body.dataset.action=name;if(reduced.matches){mixer.update(0);draw();}}
function tick(now){if(destroyed)return;frame=requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000||0);last=now;if(document.hidden)return;if(!reduced.matches){time+=dt;mixer?.update(dt);habitat?.update(time);}draw();}
function syncUI(){
 const {theme,persona,stage}=selected;$('#title').textContent=themes[theme];$('#persona-name').textContent={female:'女',male:'男',neutral:'中性'}[persona];$('#stage-name').textContent=stages[theme][stage];$('#scene-name').textContent=habitats[theme].name+' · '+stages[theme][stage];$('#habitat-name').textContent=habitats[theme].name;
 $('#reference').src='/references/'+theme+'/'+persona+'/'+stage+'.png';$('#reference').alt=themes[theme]+' '+$('#persona-name').textContent+' '+stages[theme][stage]+' 原畫';
 for(const b of document.querySelectorAll('.themes button'))b.setAttribute('aria-pressed',String(b.dataset.theme===theme));for(const b of document.querySelectorAll('.personas button'))b.setAttribute('aria-pressed',String(b.dataset.persona===persona));
 $('.evolution').replaceChildren(...stages[theme].map((label,i)=>{const b=document.createElement('button'),small=document.createElement('span'),text=document.createElement('b');small.textContent='0'+(i+1);text.textContent=label;b.append(small,text);b.dataset.stage=i;b.setAttribute('aria-pressed',String(stage===i));b.disabled=!index.has(theme+'/'+persona+'/'+i);b.onclick=()=>change({stage:i});return b;}));
 $('.controls').replaceChildren(...Object.entries(labels).map(([gesture,label])=>{const b=document.createElement('button');b.dataset.action='interact_'+gesture;b.disabled=true;b.textContent=gesture==='offer'&&(theme==='immortal'&&stage<3||theme==='garden'&&stage<3)?'澆一點水':theme==='train'&&gesture==='offer'?'補充燃料':gesture==='play'&&theme==='ocean'?'一起游泳':gesture==='play'&&theme==='train'?'噗噗出發':label;b.onclick=()=>{play(b.dataset.action);for(const x of document.querySelectorAll('.controls button'))x.setAttribute('aria-pressed',String(x===b));$('#caption').textContent=b.textContent+' · 互動結束會回到待機。';};return b;}));
}
function setEnvironment(theme,cfg){
 if(environmentTheme===theme)return;scene.environment=null;environment?.dispose();
 const studio=new T.Scene();studio.background=new T.Color(cfg.fog);
 for(const [pos,size,color]of [[[-3,4,3],[4,4],cfg.key],[[4,2,0],[3,4],'#c8dce6'],[[0,4,-3],[3,2],'#e8d8bc']]){const o=new T.Mesh(new T.PlaneGeometry(...size),new T.MeshBasicMaterial({color,side:T.DoubleSide}));o.position.set(...pos);o.lookAt(0,1,0);studio.add(o);}
 const pmrem=new T.PMREMGenerator(renderer);environment=pmrem.fromScene(studio,.08,.1,30);scene.environment=environment.texture;scene.environmentIntensity=.45;environmentTheme=theme;pmrem.dispose();dispose(studio);
}
async function change(patch={}){
 const previous=selected.stage,previousTheme=selected.theme;selected={...selected,...patch};const {theme,persona,stage}=selected,id=++request;document.body.dataset.ready='false';loading.hidden=false;loading.textContent='正在迎接旅伴…';renderer.domElement.style.opacity='.30';syncUI();abort?.abort();abort=new AbortController();
 try{
  if(!index.has(theme+'/'+persona+'/'+stage))throw Error('這個造型仍在製作中，請稍後更新頁面。');
  const response=await fetch('/models/'+theme+'/'+persona+'/'+stage+'.glb',{signal:abort.signal});if(!response.ok)throw Error('模型暫時無法載入');const data=await response.arrayBuffer();if(data.byteLength>12*1024*1024)throw Error('模型超過大小限制');const gltf=await loader.parseAsync(data,'');
  if(id!==request){dispose(gltf.scene);return;}
  const map=Object.fromEntries(gltf.animations.map(c=>[c.name,c]));if(['idle','enter','interact_pat','interact_offer','interact_play','interact_care','interact_cheer'].some(n=>!map[n])){dispose(gltf.scene);throw Error('模型動作不完整');}
  mixer?.stopAllAction();if(model){mixer?.uncacheRoot(model);scene.remove(model);dispose(model);}if(habitat){scene.remove(habitat.group);habitat.dispose();}
  model=gltf.scene;model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());const scale=2.55/Math.max(size.y,size.x*.8,size.z*.72);model.scale.setScalar(scale);model.position.set(-center.x*scale,-box.min.y*scale-.95,-center.z*scale);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});scene.add(model);
  const accent={female:'#ad8ab7',male:'#4f7d9b',neutral:'#89ad95'}[persona];habitat=createHabitat(T,theme,stage,accent,true);const cell={immortal:[0,0],garden:[1,0],mountain:[2,0],space:[0,1],castle:[1,1],pet:[2,1],ocean:[0,2],gem:[1,2],train:[2,2]}[theme];painted.style.backgroundPosition=(cell[0]*50)+'% '+(cell[1]*50)+'%';setEnvironment(theme,habitat.cfg);scene.add(habitat.group);scene.fog=new T.Fog(habitat.cfg.fog,5,15);key.color.set(habitat.cfg.key);fill.color.set(theme==='space'?'#acbfe5':theme==='gem'?'#d8c4e9':'#ecf2e9');host.style.background=habitat.cfg.horizon;
  if(theme!==previousTheme){yaw=theme==='train'?.65:.25;pitch=.12;for(const b of cameraViews.children)b.setAttribute('aria-pressed','false');}distance=host.clientWidth<500?6.1:5.4;
  mixer=new T.AnimationMixer(model);clips=map;active=null;mixer.addEventListener('finished',e=>{if(e.action!==active)return;play('idle');for(const b of document.querySelectorAll('.controls button'))b.setAttribute('aria-pressed','false');});play(reduced.matches?'idle':patch.stage!==undefined&&previous!==stage?'evolve':'enter');loading.hidden=true;renderer.domElement.style.opacity='1';delete document.body.dataset.error;document.body.dataset.ready='true';document.body.dataset.theme=theme;document.body.dataset.persona=persona;document.body.dataset.stage=stage;for(const b of document.querySelectorAll('.controls button'))b.disabled=false;$('#caption').textContent='每次互動結束後，角色會回到待機。';draw();
 }catch(e){if(id!==request||e.name==='AbortError')return;loading.textContent=e.message;document.body.dataset.error=e.message;renderer.domElement.style.opacity='.25';}
}
for(const [theme,label]of Object.entries(themes)){const b=document.createElement('button');b.textContent=label;b.dataset.theme=theme;b.onclick=()=>change({theme,stage:0});$('.themes').append(b);}
for(const b of document.querySelectorAll('.personas button'))b.onclick=()=>change({persona:b.dataset.persona});
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.006;for(const b of cameraViews.children)b.setAttribute('aria-pressed','false');pitch=Math.max(-.04,Math.min(.5,pitch+(e.clientY-drag.y)*.003));drag={x:e.clientX,y:e.clientY};draw();});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(3.8,Math.min(8,distance+e.deltaY*.003));draw();},{passive:false});
reduced.addEventListener('change',()=>{last=performance.now();if(reduced.matches)play('idle');draw();});document.addEventListener('visibilitychange',()=>last=performance.now());window.addEventListener('pagehide',()=>{destroyed=true;cancelAnimationFrame(frame);abort?.abort();mixer?.stopAllAction();dispose(model);habitat?.dispose();environment?.dispose();renderer.dispose();renderer.forceContextLoss();},{once:true});
try{const r=await fetch('/cast-index.json'),items=await r.json();index=new Map(items.models.map(m=>[m.id,m]));$('#progress').textContent='美術精修中 · 九角色';resize();requestAnimationFrame(tick);await change();}catch(e){loading.textContent='角色清單暫時無法載入';document.body.dataset.error=e.message;}
// Developer-only review handle; it does not change user/account records.
window.castReview={get model(){return model;},get mixer(){return mixer;},get clips(){return clips;},get habitat(){return habitat;},get selected(){return {...selected};},get renderer(){return renderer;},get scene(){return scene;},get camera(){return camera;},change,play};
</script></html>
