<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣上市股票篩選器</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent-hover: #6fa3ff;
      --green: #26c281;
      --red: #e74c3c;
      --yellow: #f39c12;
      --text: #e2e8f0;
      --text-muted: #8892a8;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    header span {
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.04em;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .form-wrap {
      max-width: 1200px;
      margin: 0 auto 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .label-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      margin-top: 2px;
    }

    input[type="date"],
    input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 13px;
      width: 100%;
      transition: border-color 0.15s;
      outline: none;
    }

    input[type="date"]:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
    }

    .checkboxes {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-row input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-row .cb-label {
      font-size: 0.9rem;
      color: var(--text);
    }

    .checkbox-row .cb-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .results-wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .results-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .results-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .results-meta strong {
      color: var(--accent);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead tr {
      background: var(--surface2);
    }

    th {
      padding: 11px 14px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }

    th:hover { color: var(--text); }
    th.sorted { color: var(--accent); }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover {
      background: var(--surface2);
    }

    .code-cell a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-family: 'Courier New', monospace;
    }

    .code-cell a:hover { color: var(--accent-hover); text-decoration: underline; }

    .name-cell {
      color: var(--text);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .positive { color: var(--red); font-weight: 600; }
    .negative { color: var(--green); font-weight: 600; }
    .neutral { color: var(--text-muted); }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .badge-red { background: rgba(231, 76, 60, 0.2); color: var(--red); }
    .badge-green { background: rgba(38, 194, 129, 0.2); color: var(--green); }
    .badge-yellow { background: rgba(243, 156, 18, 0.15); color: var(--yellow); }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .empty-state p { font-size: 0.9rem; }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error { background: rgba(231, 76, 60, 0.12); border: 1px solid rgba(231, 76, 60, 0.3); color: #f08080; }
    .alert-info  { background: rgba(79, 142, 247, 0.1); border: 1px solid rgba(79, 142, 247, 0.25); color: #7fb3ff; }

    .sort-arrow {
      display: inline-block;
      margin-left: 4px;
      opacity: 0.4;
      font-size: 0.7rem;
    }

    th.sorted .sort-arrow { opacity: 1; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── Index Quick-Access Row ── */
    .index-row {
      max-width: 1200px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .index-row-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }
    .idx-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 13px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .idx-btn:hover { color: var(--text); border-color: var(--accent); background: var(--surface2); }

    /* ── Chart Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 880px;
      max-height: 96vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .modal-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .modal-close:hover { color: #fff; background: var(--surface2); }

    .modal-body {
      padding: 14px 20px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .chart-range-btns {
      display: flex;
      gap: 5px;
    }

    .range-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .range-btn:hover { color: var(--text); border-color: var(--accent); }
    .range-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .toolbar-sep {
      width: 1px;
      background: var(--border);
      align-self: stretch;
      margin: 0 3px;
    }

    #chartWrapper {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #131722;
    }

    /* Main candle panel */
    #mainChartPanel {
      position: relative;
      width: 100%;
    }
    #chartContainer {
      width: 100%;
      height: 220px;
    }
    #fibCanvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 11;
    }
    #chartOverlay {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      z-index: 10;
      display: none;
    }

    #maLabel {
      position: absolute;
      top: 4px; left: 8px;
      font-size: 13px;
      pointer-events: none;
      z-index: 5;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 0.04em;
      display: flex;
      gap: 8px;
    }

    /* VOL panel (separate from candles) */
    #volPanel {
      position: relative;
      width: 100%;
      border-top: 1px solid var(--border);
    }
    #volContainer { width: 100%; height: 70px; }
    #volLabel {
      position: absolute;
      top: 4px; left: 8px;
      font-size: 9px;
      color: rgba(200,209,217,0.45);
      pointer-events: none;
      z-index: 5;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    /* MACD panel */
    #macdPanel {
      position: relative;
      width: 100%;
      border-top: 1px solid var(--border);
    }
    #macdContainer { width: 100%; height: 100px; }
    #macdLabel {
      position: absolute;
      top: 4px; left: 8px;
      font-size: 9px;
      color: rgba(200,209,217,0.45);
      pointer-events: none;
      z-index: 5;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    /* RSI panel */
    #rsiPanel {
      position: relative;
      width: 100%;
      border-top: 1px solid var(--border);
    }
    #rsiContainer { width: 100%; height: 90px; }
    #rsiLabel {
      position: absolute;
      top: 4px; left: 8px;
      font-size: 9px;
      color: rgba(200,209,217,0.45);
      pointer-events: none;
      z-index: 5;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    #chartLoading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 500px;
      color: var(--text-muted);
      font-size: 0.9rem;
      gap: 10px;
    }

    .chart-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chart-toolbar-left {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .chart-tool-btns {
      display: flex;
      gap: 6px;
    }

    .tool-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tool-btn:hover { color: var(--text); border-color: var(--accent); }
    .tool-btn.active { background: rgba(243,156,18,0.2); border-color: var(--yellow); color: var(--yellow); }

    tbody tr { cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>台灣上市股票篩選器</h1>
    <span>TWSE</span>
  </header>

  <div class="form-wrap">
    <div class="card">
      <div class="form-grid">
        <!-- 日期 -->
        <div class="field">
          <label>篩選日期</label>
          <div class="label-hint">空白 = 最新交易日；可輸入歷史日期</div>
          <input type="date" id="date" />
        </div>

        <!-- 長紅棒 -->
        <div class="field">
          <label>長紅棒幅度 (%)</label>
          <div class="label-hint">(收 - 開) / 開 × 100 ≥ 此值</div>
          <input type="number" id="red_candle_pct" min="0" max="20" step="0.1" placeholder="例：3（代表 3%）" />
        </div>

        <!-- 放量倍數 -->
        <div class="field">
          <label>放量倍數</label>
          <div class="label-hint">昨日 max(5日均量, 10日均量) × 倍數</div>
          <input type="number" id="volume_multiplier" min="0" step="0.1" placeholder="例：1.5（代表 1.5 倍）" />
        </div>

        <!-- 複選框 -->
        <div class="field">
          <label>額外條件</label>
          <div class="label-hint">&nbsp;</div>
          <div class="checkboxes">
            <label class="checkbox-row">
              <input type="checkbox" id="limit_up" />
              <div>
                <div class="cb-label">漲停板</div>
                <div class="cb-hint">當日收盤達漲停價（+10%）</div>
              </div>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="macd_golden" />
              <div>
                <div class="cb-label">MACD 黃金交叉</div>
                <div class="cb-hint">昨日 MACD &lt; Signal，今日 MACD &gt; Signal</div>
              </div>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="gap_up" />
              <div>
                <div class="cb-label">跳空向上</div>
                <div class="cb-hint">當日開盤 &gt; 前日最高</div>
              </div>
            </label>
          </div>
        </div>

        <!-- 按鈕 -->
        <div class="field">
          <label>&nbsp;</label>
          <div class="label-hint">&nbsp;</div>
          <button class="btn-submit" id="submitBtn" onclick="doScreen()">
            開始篩選
          </button>
        </div>
      </div>
      <div id="dataDateDisplay" style="margin-top:12px;font-size:0.78rem;color:var(--text-muted);"></div>
    </div>
  </div>

  <!-- 指數快覽 -->
  <div class="index-row">
    <span class="index-row-label">指數快覽</span>
    <button class="idx-btn" onclick="openIndexChart('^TWII','大盤 加權指數')">大盤</button>
    <button class="idx-btn" onclick="openIndexChart('^N225','日經225')">日經225</button>
    <button class="idx-btn" onclick="openIndexChart('^KS11','韓國綜合指數')">韓指</button>
    <button class="idx-btn" onclick="openIndexChart('NQ=F','那斯達克 NQ 期貨')">那指</button>
    <button class="idx-btn" onclick="openIndexChart('YM=F','道瓊 YM 期貨')">道指</button>
  </div>

  <div class="results-wrap">
    <div id="statusArea"></div>
    <div id="resultsArea"></div>
  </div>

  <!-- K線圖 Modal -->
  <div class="modal-overlay" id="chartModal" onclick="closeChartIfBg(event)">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle">—</div>
          <div class="modal-subtitle" id="modalSubtitle">日K線</div>
        </div>
        <button class="modal-close" onclick="closeChart()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="chart-toolbar">
          <div class="chart-toolbar-left">
            <button class="tool-btn" id="dailyBtn" onclick="loadDailyChart()" style="background:#2962ff;color:#fff">日K</button>
            <div class="toolbar-sep"></div>
            <button class="tool-btn" id="marketBtn" onclick="openMarketChart()">大盤K</button>
            <button class="tool-btn" id="backBtn" style="display:none" onclick="goBackToStock()">← 返回</button>
          </div>
          <div class="chart-tool-btns">
            <button class="tool-btn" id="fibBtn" onclick="toggleFibMode()">📐 斐波那契</button>
            <button class="tool-btn" id="trendBtn" onclick="toggleTrendLine()">📏 趨勢線</button>
            <button class="tool-btn" onclick="clearAllDrawings()">✕ 清除</button>
          </div>
        </div>
        <div id="chartLoading"><div class="spinner"></div> 載入中...</div>
        <div id="chartWrapper" style="display:none">
          <div id="mainChartPanel">
            <div id="chartContainer"></div>
            <canvas id="fibCanvas"></canvas>
            <div id="chartOverlay"></div>
            <div id="maLabel">
              <span style="color:#FFE600">MA5</span>
              <span style="color:#FF8C00">MA10</span>
              <span style="color:#00E676">MA20</span>
              <span style="color:#29B6F6">MA60</span>
              <span style="color:#CE93D8">MA120</span>
              <span style="color:#FF5252">MA240</span>
            </div>
          </div>
          <div id="volPanel">
            <div id="volContainer"></div>
            <div id="volLabel">VOL<span style="color:#f39c12"> ─MA5</span><span style="color:#e74c3c"> ─MA10</span></div>
          </div>
          <div id="macdPanel">
            <div id="macdContainer"></div>
            <div id="macdLabel"><span style="color:#e74c3c">▬</span>MACD &nbsp;<span style="color:#f39c12">▬</span>Signal &nbsp;<span style="color:rgba(200,209,217,0.5)">▬</span>Hist</div>
          </div>
          <div id="rsiPanel">
            <div id="rsiContainer"></div>
            <div id="rsiLabel"><span style="color:#f39c12">─RSI(5)</span><span style="color:#4f8ef7"> ─RSI(10)</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let sortKey = 'candle_pct';
    let sortDir = -1;
    let lastResults = [];
    let hasVolFilter = false;

    function showStatus(html) {
      document.getElementById('statusArea').innerHTML = html;
    }

    function doScreen() {
      const dateVal = document.getElementById('date').value;
      const redPct = parseFloat(document.getElementById('red_candle_pct').value) || 0;
      const volMult = parseFloat(document.getElementById('volume_multiplier').value) || 0;
      const limitUp = document.getElementById('limit_up').checked;
      const gapUp = document.getElementById('gap_up').checked;
      const macdGolden = document.getElementById('macd_golden').checked;
      hasVolFilter = volMult > 0;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> 資料載入中...';
      document.getElementById('resultsArea').innerHTML = '';
      document.getElementById('dataDateDisplay').textContent = '';

      const isHistorical = dateVal && dateVal.length > 0;
      let hint = isHistorical
        ? `正在透過 Yahoo Finance 取得 ${dateVal} 歷史資料，請稍候（約 10–20 秒）...`
        : '正在向台灣證交所取得最新交易日資料...';
      showStatus(`<div class="alert alert-info">&#8987; ${hint}</div>`);

      const body = {
        date: dateVal ? dateVal.replace(/-/g, '') : '',
        red_candle_pct: redPct,
        volume_multiplier: volMult,
        limit_up: limitUp,
        gap_up: gapUp,
        macd_golden: macdGolden,
      };

      fetch('/api/screen', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
        .then(r => r.json())
        .then(data => {
          btn.disabled = false;
          btn.innerHTML = '開始篩選';

          if (data.error) {
            showStatus(`<div class="alert alert-error">&#9888; ${data.error}</div>`);
            document.getElementById('resultsArea').innerHTML = '';
            return;
          }

          lastResults = data.results || [];
          renderResults(data);
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerHTML = '開始篩選';
          showStatus(`<div class="alert alert-error">&#9888; 連線錯誤：${err.message}</div>`);
        });
    }

    function renderResults(data) {
      const results = data.results || [];

      // Show actual data date returned from API
      if (data.date) {
        const dateInput = document.getElementById('date').value;
        const isHist = dateInput && dateInput.length > 0;

    function renderTable(results) {
      const sorted = [...results].sort((a, b) => {

        <th onclick="setSort('vol_ratio')" class="${sortKey==='vol_ratio'?'sorted':''}">放量倍數<span class="sort-arrow">${sortKey==='vol_ratio'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
      ` : '';

      const rows = sorted.map(s => {
        const changeCls = (s.change_pct ?? 0) > 0 ? 'positive' : (s.change_pct ?? 0) < 0 ? 'negative' : 'neutral';
        const candleCls = s.candle_pct > 0 ? 'positive' : s.candle_pct < 0 ? 'negative' : 'neutral';
        const changeStr = s.change_pct != null
          ? (s.change_pct > 0 ? `+${s.change_pct}%` : `${s.change_pct}%`)
          : '–';
        const candleStr = s.candle_pct > 0
          ? `+${s.candle_pct}%`
          : `${s.candle_pct}%`;

        const volCells = hasVolFilter ? `
          <td class="neutral">${s.ma5_vol != null ? Number(s.ma5_vol).toLocaleString() : '–'}</td>
          <td class="neutral">${s.ma10_vol != null ? Number(s.ma10_vol).toLocaleString() : '–'}</td>
          <td>${s.vol_ratio != null ? `<span class="badge badge-yellow">${s.vol_ratio}x</span>` : '–'}</td>
        ` : '';

        return `
          <tr onclick="openChart('${s.code}','${s.name.replace(/'/g,"\\'")}')">
            <td class="code-cell"><a href="https://www.twse.com.tw/zh/trading/historical/stock-day.html?stockNo=${s.code}" target="_blank" onclick="event.stopPropagation()">${s.code}</a></td>
            <td class="name-cell">${s.name}</td>
            <td class="neutral">${s.open}</td>
            <td class="neutral">${s.high}</td>
            <td class="neutral">${s.low}</td>
            <td class="${changeCls}">${s.close}</td>
            <td class="${changeCls}">${changeStr}</td>
            <td class="${candleCls}">${candleStr}</td>
            <td class="neutral">${Number(s.volume_lots).toLocaleString()} 張</td>
            ${volCells}
          </tr>`;
      }).join('');

      document.getElementById('resultsArea').innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th onclick="setSort('code')" class="${sortKey==='code'?'sorted':''}">代號<span class="sort-arrow">${sortKey==='code'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th>名稱</th>
                <th onclick="setSort('open')" class="${sortKey==='open'?'sorted':''}">開盤<span class="sort-arrow">${sortKey==='open'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('high')" class="${sortKey==='high'?'sorted':''}">最高<span class="sort-arrow">${sortKey==='high'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('low')" class="${sortKey==='low'?'sorted':''}">最低<span class="sort-arrow">${sortKey==='low'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('close')" class="${sortKey==='close'?'sorted':''}">收盤<span class="sort-arrow">${sortKey==='close'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('change_pct')" class="${sortKey==='change_pct'?'sorted':''}">漲跌幅<span class="sort-arrow">${sortKey==='change_pct'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('candle_pct')" class="${sortKey==='candle_pct'?'sorted':''}">紅棒幅度<span class="sort-arrow">${sortKey==='candle_pct'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('volume_lots')" class="${sortKey==='volume_lots'?'sorted':''}">成交量<span class="sort-arrow">${sortKey==='volume_lots'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                ${volCols}

          </table>
        </div>`;
    }

    // ── Technical indicator calculations ──────────────────
    function calcEMA(values, period) {
      const res = new Array(values.length).fill(null);
      if (values.length < period) return res;
      const k = 2 / (period + 1);
      let sum = 0;
      for (let i = 0; i < period; i++) sum += values[i];
      res[period - 1] = sum / period;
      for (let i = period; i < values.length; i++)
        res[i] = values[i] * k + res[i - 1] * (1 - k);
      return res;
    }

    function calcMACD(closes) {
      const ema12 = calcEMA(closes, 12);
      const ema26 = calcEMA(closes, 26);
      const macdLine = closes.map((_, i) =>
        ema12[i] !== null && ema26[i] !== null ? ema12[i] - ema26[i] : null);
      const validVals = [], validIdx = [];
      macdLine.forEach((v, i) => { if (v !== null) { validVals.push(v); validIdx.push(i); } });
      const sigVals = calcEMA(validVals, 9);
      const sigLine = new Array(closes.length).fill(null);
      sigVals.forEach((v, i) => { sigLine[validIdx[i]] = v; });
      const hist = closes.map((_, i) =>
        macdLine[i] !== null && sigLine[i] !== null ? macdLine[i] - sigLine[i] : null);
      return { macd: macdLine, signal: sigLine, hist };
    }

    function calcRSI(closes, period = 14) {
      const res = new Array(closes.length).fill(null);
      if (closes.length < period + 1) return res;
      let avgG = 0, avgL = 0;
      for (let i = 1; i <= period; i++) {
        const d = closes[i] - closes[i - 1];
        if (d > 0) avgG += d; else avgL -= d;
      }
      avgG /= period; avgL /= period;
      res[period] = 100 - 100 / (1 + (avgL > 0 ? avgG / avgL : Infinity));
      for (let i = period + 1; i < closes.length; i++) {
        const d = closes[i] - closes[i - 1];
        avgG = (avgG * (period - 1) + Math.max(d, 0)) / period;
        avgL = (avgL * (period - 1) + Math.max(-d, 0)) / period;
        res[i] = 100 - 100 / (1 + (avgL > 0 ? avgG / avgL : Infinity));
      }
      return res;
    }

    function calcVolMA(volumes, period) {
      return volumes.map((_, i) => {
        if (i < period - 1) return null;
        let s = 0;
        for (let j = i - period + 1; j <= i; j++) s += volumes[j];
        return s / period;
      });
    }

    function calcSMA(closes, period) {
      return closes.map((_, i) => {
        if (i < period - 1) return null;
        let s = 0;
        for (let j = i - period + 1; j <= i; j++) s += closes[j];
        return s / period;
      });
    }

    // ── Render all chart panels ───────────────────────────
    function renderTVChart(candles) {
      document.getElementById('chartLoading').style.display = 'none';
      document.getElementById('chartWrapper').style.display = 'block';

      _renderMainChart(candles);
      _renderVOLChart(candles);
      _renderMACDChart(candles);
      _renderRSIChart(candles);

      // Fit main, sync all other panels to same TIME range
      chartInstance.timeScale().fitContent();
      const mainTimeRange = chartInstance.timeScale().getVisibleRange();
      if (mainTimeRange) {
        [volInstance, macdInstance, rsiInstance].forEach(c => {
          try { c.timeScale().setVisibleRange(mainTimeRange); } catch (_) {}
        });
      }

      // Equalize right price scale widths across all 4 panels after layout settles
      setTimeout(() => {
        const all = [chartInstance, volInstance, macdInstance, rsiInstance].filter(Boolean);
        try {
          const maxW = Math.max(...all.map(c => c.priceScale('right').width() || 0));
          if (maxW > 0) {
            all.forEach(c => c.priceScale('right').applyOptions({ minimumWidth: maxW }));
            const r = chartInstance.timeScale().getVisibleRange();
            if (r) [volInstance, macdInstance, rsiInstance].forEach(c => {
              try { c.timeScale().setVisibleRange(r); } catch (_) {}
            });
          }
        } catch (_) {}
      }, 0);

      _syncTimeRanges([chartInstance, volInstance, macdInstance, rsiInstance].filter(Boolean));
      resizeFibCanvas();

      // Resize observer
      const mainEl = document.getElementById('chartContainer');
      new ResizeObserver(() => {
        if (chartInstance) chartInstance.applyOptions({ width: mainEl.clientWidth });
        if (volInstance)   volInstance.applyOptions({ width: document.getElementById('volContainer').clientWidth });
        if (macdInstance)  macdInstance.applyOptions({ width: document.getElementById('macdContainer').clientWidth });
        if (rsiInstance)   rsiInstance.applyOptions({ width: document.getElementById('rsiContainer').clientWidth });
        resizeFibCanvas();
        if (trendLines.length > 0) redrawCanvas();
      }).observe(mainEl);

      // Redraw trend lines when chart is panned / zoomed
      chartInstance.timeScale().subscribeVisibleTimeRangeChange(() => {
        if (trendLines.length > 0 || trendStart) redrawCanvas();
      });

      // Prevent zooming out beyond the loaded dataset (3 years) on ALL panels
      const _maxBars = candles.length;
      let _lockingZoom = false;
      const _allCharts = [chartInstance, volInstance, macdInstance, rsiInstance].filter(Boolean);
      _allCharts.forEach(c => {
        c.timeScale().subscribeVisibleLogicalRangeChange(range => {
          if (_lockingZoom || !range) return;
          if (range.to - range.from > _maxBars + 5) {
            _lockingZoom = true;
            _allCharts.forEach(cc => {
              try { cc.timeScale().setVisibleLogicalRange({ from: -2, to: _maxBars + 2 }); } catch (_) {}
            });
            _lockingZoom = false;
          }
        });
      });

    }

    function _chartOpts(height, showTime) {
      return {
        width: 0, height,
        layout: { background: { color: '#131722' }, textColor: '#c9d1d9' },
        grid: { vertLines: { color: '#2e3350' }, horzLines: { color: '#2e3350' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2e3350', minimumWidth: 65 },
        timeScale: { borderColor: '#2e3350', timeVisible: true, visible: showTime,
                     secondsVisible: false, rightOffset: 5 },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true },
        handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: true },
      };
    }

    function _renderMainChart(candles) {
      const el = document.getElementById('chartContainer');
      el.innerHTML = '';
      const opts = _chartOpts(220, false);
      opts.width = el.clientWidth;
      chartInstance = LightweightCharts.createChart(el, opts);

      candleSeriesRef = chartInstance.addCandlestickSeries({
        upColor: '#e74c3c', downColor: '#26c281',
        borderUpColor: '#e74c3c', borderDownColor: '#26c281',
        wickUpColor: '#e74c3c', wickDownColor: '#26c281',
      });
      candleSeriesRef.setData(candles);

      // MA 5/10/20/60/120/240 均線
      const closes = candles.map(c => c.close);
      const MA_COLORS = [
        { period: 5,   color: '#FFE600' },  // 亮黃
        { period: 10,  color: '#FF8C00' },  // 亮橘
        { period: 20,  color: '#00E676' },  // 亮綠
        { period: 60,  color: '#29B6F6' },  // 亮藍
        { period: 120, color: '#CE93D8' },  // 亮紫
        { period: 240, color: '#FF5252' },  // 亮紅
      ];
      MA_COLORS.forEach(({ period, color }) => {
        const sma = calcSMA(closes, period);
        const s = chartInstance.addLineSeries({
          color, lineWidth: 1.5,
          crosshairMarkerVisible: false,
          lastValueVisible: false,
          priceLineVisible: false,
        });
        s.setData(candles.map((c, i) => sma[i] !== null ? { time: c.time, value: sma[i] } : null).filter(Boolean));
      });
    }

    function _renderVOLChart(candles) {
      const el = document.getElementById('volContainer');
      el.innerHTML = '';
      const opts = _chartOpts(70, false);
      opts.width = el.clientWidth;
      opts.rightPriceScale.scaleMargins = { top: 0.1, bottom: 0.05 };
      volInstance = LightweightCharts.createChart(el, opts);

      const vols = candles.map(c => c.volume);
      const vma5  = calcVolMA(vols, 5);
      const vma10 = calcVolMA(vols, 10);

      // Y 軸只參考可視範圍內的量，避免歷史高峰壓縮近期柱子
      function _visibleVolMax() {
        const range = volInstance.timeScale().getVisibleLogicalRange();
        const from = range ? Math.max(0, Math.floor(range.from)) : Math.max(0, vols.length - 60);
        const to   = range ? Math.min(vols.length - 1, Math.ceil(range.to)) : vols.length - 1;
        const vals = [
          ...vols.slice(from, to + 1),
          ...vma5.slice(from, to + 1).filter(v => v !== null),
          ...vma10.slice(from, to + 1).filter(v => v !== null),
        ].filter(v => v > 0);
        return vals.length > 0 ? Math.max(...vals) : 1;
      }
      const _autoScale = () => ({ priceRange: { minValue: 0, maxValue: _visibleVolMax() * 1.1 } });

      const volSeries = volInstance.addHistogramSeries({
        priceFormat: { type: 'volume' }, priceScaleId: 'right',
        lastValueVisible: false,
        autoscaleInfoProvider: _autoScale,
      });
      volSeries.setData(candles.map(c => ({
        time: c.time, value: c.volume,
        color: c.close >= c.open ? 'rgba(231,76,60,0.4)' : 'rgba(38,194,129,0.4)',
      })));

      const vma5s = volInstance.addLineSeries({
        color: '#f39c12', lineWidth: 1,
        crosshairMarkerVisible: false, lastValueVisible: false,
        autoscaleInfoProvider: _autoScale,
      });
      const vma10s = volInstance.addLineSeries({
        color: '#e74c3c', lineWidth: 1,
        crosshairMarkerVisible: false, lastValueVisible: false,
        autoscaleInfoProvider: _autoScale,
      });
      vma5s.setData(candles.map((c, i) => vma5[i]  !== null ? { time: c.time, value: vma5[i]  } : null).filter(Boolean));
      vma10s.setData(candles.map((c, i) => vma10[i] !== null ? { time: c.time, value: vma10[i] } : null).filter(Boolean));
    }

    function _renderMACDChart(candles) {
      const el = document.getElementById('macdContainer');
      el.innerHTML = '';
      const closes = candles.map(c => c.close);
      const times  = candles.map(c => c.time);
      const { macd, signal, hist } = calcMACD(closes);

      const opts = _chartOpts(100, false);
      opts.width = el.clientWidth;
      opts.rightPriceScale.scaleMargins = { top: 0.1, bottom: 0.1 };
      macdInstance = LightweightCharts.createChart(el, opts);

      const histSeries = macdInstance.addHistogramSeries({ priceScaleId: 'right' });
      histSeries.setData(
        times.map((t, i) => hist[i] !== null ? {
          time: t, value: hist[i],
          color: hist[i] >= 0 ? 'rgba(231,76,60,0.65)' : 'rgba(38,194,129,0.65)',
        } : null).filter(Boolean)
      );
      const macdSeries = macdInstance.addLineSeries({ color: '#e74c3c', lineWidth: 1, priceScaleId: 'right' });
      macdSeries.setData(times.map((t, i) => macd[i] !== null ? { time: t, value: macd[i] } : null).filter(Boolean));
      const sigSeries = macdInstance.addLineSeries({ color: '#f39c12', lineWidth: 1, priceScaleId: 'right' });
      sigSeries.setData(times.map((t, i) => signal[i] !== null ? { time: t, value: signal[i] } : null).filter(Boolean));
      macdSeries.createPriceLine({
        price: 0, color: 'rgba(200,209,217,0.25)', lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false,
      });
    }

    function _renderRSIChart(candles) {
      const el = document.getElementById('rsiContainer');
      el.innerHTML = '';
      const closes = candles.map(c => c.close);
      const times  = candles.map(c => c.time);
      const rsi5  = calcRSI(closes, 5);
      const rsi10 = calcRSI(closes, 10);

      const opts = _chartOpts(90, true);
      opts.width = el.clientWidth;
      opts.rightPriceScale.scaleMargins = { top: 0.05, bottom: 0.05 };
      rsiInstance = LightweightCharts.createChart(el, opts);

      const autoScale = () => ({ priceRange: { minValue: 0, maxValue: 100 } });
      const r10 = rsiInstance.addLineSeries({ color: '#4f8ef7', lineWidth: 1, priceScaleId: 'right', autoscaleInfoProvider: autoScale });
      const r5  = rsiInstance.addLineSeries({ color: '#f39c12', lineWidth: 1, priceScaleId: 'right', autoscaleInfoProvider: autoScale });
      r10.setData(times.map((t, i) => rsi10[i] !== null ? { time: t, value: rsi10[i] } : null).filter(Boolean));
      r5.setData(times.map((t, i)  => rsi5[i]  !== null ? { time: t, value: rsi5[i]  } : null).filter(Boolean));
      [{ p: 70, c: 'rgba(231,76,60,0.4)' }, { p: 50, c: 'rgba(200,209,217,0.2)' }, { p: 30, c: 'rgba(38,194,129,0.4)' }]
        .forEach(({ p, c }) => r10.createPriceLine({
          price: p, color: c, lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '',
        }));
    }

    function _syncTimeRanges(charts) {
      let syncing = false;
      charts.forEach(src => {
        src.timeScale().subscribeVisibleTimeRangeChange(range => {
          if (syncing || !range) return;
          syncing = true;
          charts.forEach(tgt => {
            if (tgt !== src) try { tgt.timeScale().setVisibleRange(range); } catch(e) {}
          });
          syncing = false;
        });
      });
    }

    // ── Drawing: canvas utilities ─────────────────────────
    function resizeFibCanvas() {
      const canvas = document.getElementById('fibCanvas');
      const panel  = document.getElementById('mainChartPanel');
      if (!canvas || !panel) return;
      canvas.width  = panel.clientWidth;
      canvas.height = panel.clientHeight;
    }

    function _clearCanvas() {
      const canvas = document.getElementById('fibCanvas');
      if (!canvas) return;
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    // Redraws completed trend lines on the canvas (clears first)
    function redrawCanvas() {
      const canvas = document.getElementById('fibCanvas');
      if (!canvas || !chartInstance || !candleSeriesRef) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      _drawTrendLinesOnCtx(ctx);
    }

    function _drawTrendLinesOnCtx(ctx) {
      trendLines.forEach(line => {
        const x1 = chartInstance.timeScale().timeToCoordinate(line.time1);
        const y1 = candleSeriesRef.priceToCoordinate(line.price1);
        const x2 = chartInstance.timeScale().timeToCoordinate(line.time2);
        const y2 = candleSeriesRef.priceToCoordinate(line.price2);
        if (x1 == null || y1 == null || x2 == null || y2 == null) return;
        ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.fillStyle = '#f39c12';
        [{ x: x1, y: y1 }, { x: x2, y: y2 }].forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
        });
      });
      // Anchor dot for in-progress trend line (first click placed)
      if (trendStart) {
        const ax = chartInstance.timeScale().timeToCoordinate(trendStart.time);
        const ay = candleSeriesRef.priceToCoordinate(trendStart.price);
        if (ax != null && ay != null) {
          ctx.fillStyle = '#f39c12';
          ctx.beginPath(); ctx.arc(ax, ay, 5, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    // ── Fibonacci + Trend line overlay ────────────────────
    function setupFibOverlay() {
      const overlay = document.getElementById('chartOverlay');
      const canvas  = document.getElementById('fibCanvas');

      function getY(clientY) { return clientY - overlay.getBoundingClientRect().top; }
      function getX(clientX) { return clientX - overlay.getBoundingClientRect().left; }

      function drawBand(y0, y1) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        _drawTrendLinesOnCtx(ctx);  // keep trend lines behind fib rubber band
        const minY = Math.min(y0, y1), h = Math.abs(y1 - y0);
        ctx.fillStyle = 'rgba(243,156,18,0.08)';
        ctx.fillRect(0, minY, canvas.width, h);
        ctx.strokeStyle = 'rgba(243,156,18,0.55)';
        ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
        ctx.strokeRect(0, minY, canvas.width, h);
        ctx.setLineDash([]);
      }

      function finishFib(endY) {
        if (!fibDragStart || !candleSeriesRef) { fibDragStart = null; return; }
        const p2 = candleSeriesRef.coordinateToPrice(endY);
        if (p2 == null) { fibDragStart = null; return; }
        const high = Math.max(fibDragStart.price, p2);
        const low  = Math.min(fibDragStart.price, p2);
        if (high !== low) drawFibLines(high, low);
        redrawCanvas();
        fibDragStart = null; fibMode = false;
        document.getElementById('fibBtn').classList.remove('active');
        overlay.style.display = trendLineMode ? 'block' : 'none';
      }

      function handleTrendClick(clientX, clientY) {
        if (!chartInstance || !candleSeriesRef) return;
        const time  = chartInstance.timeScale().coordinateToTime(getX(clientX));
        const price = candleSeriesRef.coordinateToPrice(getY(clientY));
        if (time == null || price == null) return;
        if (!trendStart) {
          trendStart = { time, price };
          redrawCanvas();
        } else {
          trendLines.push({ time1: trendStart.time, price1: trendStart.price, time2: time, price2: price });
          trendStart = null;
          redrawCanvas();
        }
      }

      overlay.addEventListener('mousedown', e => {
        if (!candleSeriesRef) return;
        if (fibMode) {
          const y = getY(e.clientY);
          const price = candleSeriesRef.coordinateToPrice(y);
          if (price != null) fibDragStart = { y, price };
        } else if (trendLineMode) {
          const time  = chartInstance.timeScale().coordinateToTime(getX(e.clientX));
          const price = candleSeriesRef.coordinateToPrice(getY(e.clientY));
          if (time != null && price != null) { trendStart = { time, price }; redrawCanvas(); }
        }
      });
      overlay.addEventListener('mousemove', e => {
        if (fibMode && fibDragStart) {
          drawBand(fibDragStart.y, getY(e.clientY));
        } else if (trendLineMode && trendStart) {
          // Preview dashed line while dragging
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          _drawTrendLinesOnCtx(ctx);
          const ax = chartInstance.timeScale().timeToCoordinate(trendStart.time);
          const ay = candleSeriesRef.priceToCoordinate(trendStart.price);
          if (ax != null && ay != null) {
            ctx.strokeStyle = 'rgba(243,156,18,0.75)';
            ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
            ctx.beginPath(); ctx.moveTo(ax, ay);
            ctx.lineTo(getX(e.clientX), getY(e.clientY)); ctx.stroke();
            ctx.setLineDash([]);
          }
        }
      });
      overlay.addEventListener('mouseup', e => {
        if (fibMode) {
          finishFib(getY(e.clientY));
        } else if (trendLineMode && trendStart) {
          const time  = chartInstance.timeScale().coordinateToTime(getX(e.clientX));
          const price = candleSeriesRef.coordinateToPrice(getY(e.clientY));
          if (time != null && price != null) {
            trendLines.push({ time1: trendStart.time, price1: trendStart.price, time2: time, price2: price });
          }
          trendStart = null;
          redrawCanvas();
        }
      });

      overlay.addEventListener('touchstart', e => {
        if (!candleSeriesRef) return; e.preventDefault();
        if (fibMode) {
          const y = getY(e.touches[0].clientY);
          const price = candleSeriesRef.coordinateToPrice(y);
          if (price != null) fibDragStart = { y, price };
        } else if (trendLineMode) {
          const time  = chartInstance.timeScale().coordinateToTime(getX(e.touches[0].clientX));
          const price = candleSeriesRef.coordinateToPrice(getY(e.touches[0].clientY));
          if (time != null && price != null) { trendStart = { time, price }; redrawCanvas(); }
        }
      }, { passive: false });
      overlay.addEventListener('touchmove', e => {
        e.preventDefault();
        if (fibMode && fibDragStart) {
          drawBand(fibDragStart.y, getY(e.touches[0].clientY));
        } else if (trendLineMode && trendStart) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          _drawTrendLinesOnCtx(ctx);
          const ax = chartInstance.timeScale().timeToCoordinate(trendStart.time);
          const ay = candleSeriesRef.priceToCoordinate(trendStart.price);
          if (ax != null && ay != null) {
            ctx.strokeStyle = 'rgba(243,156,18,0.75)';
            ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
            ctx.beginPath(); ctx.moveTo(ax, ay);
            ctx.lineTo(getX(e.touches[0].clientX), getY(e.touches[0].clientY)); ctx.stroke();
            ctx.setLineDash([]);
          }
        }
      }, { passive: false });
      overlay.addEventListener('touchend', e => {
        e.preventDefault();
        if (fibMode) {
          finishFib(getY(e.changedTouches[0].clientY));
        } else if (trendLineMode && trendStart) {
          const time  = chartInstance.timeScale().coordinateToTime(getX(e.changedTouches[0].clientX));
          const price = candleSeriesRef.coordinateToPrice(getY(e.changedTouches[0].clientY));
          if (time != null && price != null) {
            trendLines.push({ time1: trendStart.time, price1: trendStart.price, time2: time, price2: price });
          }
          trendStart = null;
          redrawCanvas();
        }
      }, { passive: false });
    }

    function toggleFibMode() {
      if (!chartInstance) return;
      trendLineMode = false; trendStart = null;
      document.getElementById('trendBtn').classList.remove('active');
      fibMode = !fibMode;
      document.getElementById('fibBtn').classList.toggle('active', fibMode);
      document.getElementById('chartOverlay').style.display = fibMode ? 'block' : 'none';
      if (!fibMode) { fibDragStart = null; redrawCanvas(); }
    }

    function toggleTrendLine() {
      if (!chartInstance) return;
      fibMode = false; fibDragStart = null;
      document.getElementById('fibBtn').classList.remove('active');
      trendLineMode = !trendLineMode;
      trendStart = null;
      document.getElementById('trendBtn').classList.toggle('active', trendLineMode);
      document.getElementById('chartOverlay').style.display = trendLineMode ? 'block' : 'none';
      if (!trendLineMode) redrawCanvas();
    }

    function clearAllDrawings() {
      fibLines.forEach(pl => {
        try { if (candleSeriesRef) candleSeriesRef.removePriceLine(pl); } catch(e) {}
      });
      fibLines = []; fibDragStart = null;
      trendLines = []; trendStart = null;
      _clearCanvas();
    }

    function drawFibLines(high, low) {
      if (!candleSeriesRef) return;
      fibLines.forEach(pl => { try { candleSeriesRef.removePriceLine(pl); } catch(e) {} });
      fibLines = [];
      const range = high - low;
      [
        { ratio: 0,     label: '0%',    color: '#e74c3c' },
        { ratio: 0.236, label: '23.6%', color: '#f39c12' },
        { ratio: 0.382, label: '38.2%', color: '#2ecc71' },
        { ratio: 0.5,   label: '50%',   color: '#4f8ef7' },
        { ratio: 0.618, label: '61.8%', color: '#9b59b6' },
        { ratio: 1,     label: '100%',  color: '#e74c3c' },
      ].forEach(({ ratio, label, color }) => {
        const price = parseFloat((high - range * ratio).toFixed(2));
        fibLines.push(candleSeriesRef.createPriceLine({
          price, color, lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: `Fib ${label}  ${price}`,
        }));
      });
    }
  </script>
