<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣上市股票篩選器</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent-hover: #6fa3ff;
      --green: #26c281;
      --red: #e74c3c;
      --yellow: #f39c12;
      --text: #e2e8f0;
      --text-muted: #8892a8;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    header span {
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.04em;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .form-wrap {
      max-width: 1200px;
      margin: 0 auto 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .label-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      margin-top: 2px;
    }

    input[type="date"],
    input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 13px;
      width: 100%;
      transition: border-color 0.15s;
      outline: none;
    }

    input[type="date"]:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
    }

    .checkboxes {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-row input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-row .cb-label {
      font-size: 0.9rem;
      color: var(--text);
    }

    .checkbox-row .cb-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .results-wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .results-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .results-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .results-meta strong {
      color: var(--accent);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead tr {
      background: var(--surface2);
    }

    th {
      padding: 11px 14px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }

    th:hover { color: var(--text); }
    th.sorted { color: var(--accent); }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover {
      background: var(--surface2);
    }

    .code-cell a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-family: 'Courier New', monospace;
    }

    .code-cell a:hover { color: var(--accent-hover); text-decoration: underline; }

    .name-cell {
      color: var(--text);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .positive { color: var(--red); font-weight: 600; }
    .negative { color: var(--green); font-weight: 600; }
    .neutral { color: var(--text-muted); }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .badge-red { background: rgba(231, 76, 60, 0.2); color: var(--red); }
    .badge-green { background: rgba(38, 194, 129, 0.2); color: var(--green); }
    .badge-yellow { background: rgba(243, 156, 18, 0.15); color: var(--yellow); }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .empty-state p { font-size: 0.9rem; }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error { background: rgba(231, 76, 60, 0.12); border: 1px solid rgba(231, 76, 60, 0.3); color: #f08080; }
    .alert-info  { background: rgba(79, 142, 247, 0.1); border: 1px solid rgba(79, 142, 247, 0.25); color: #7fb3ff; }

    .sort-arrow {
      display: inline-block;
      margin-left: 4px;
      opacity: 0.4;
      font-size: 0.7rem;
    }

    th.sorted .sort-arrow { opacity: 1; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── Index Quick-Access Row ── */
    .index-row {
      max-width: 1200px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .index-row-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }
    .idx-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 13px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .idx-btn:hover { color: var(--text); border-color: var(--accent); background: var(--surface2); }

    /* ── Chart Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 880px;
      max-height: 96vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .modal-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .modal-close:hover { color: #fff; background: var(--surface2); }

    .modal-body {
      padding: 14px 20px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .chart-range-btns {
      display: flex;
      gap: 5px;
    }

    .range-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .range-btn:hover { color: var(--text); border-color: var(--accent); }
    .range-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .toolbar-sep {
      width: 1px;
      background: var(--border);
      align-self: stretch;
      margin: 0 3px;
    }

    #chartWrapper {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #131722;
    }

    /* Main candle panel */
    #mainChartPanel {
      position: relative;
      width: 100%;
    }
    #chartContainer {
      width: 100%;
      height: 270px;
    }
    #fibCanvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 11;
    }
    #chartOverlay {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      z-index: 10;
      display: none;
    }
    #volLabel {
      position: absolute;
      bottom: 26px;
      left: 8px;
      font-size: 10px;
      color: rgba(200,209,217,0.4);
      pointer-events: none;
      z-index: 5;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    /* MACD panel */
    #macdPanel {
      position: relative;
      width: 100%;
      border-top: 1px solid var(--border);
    }
    #macdContainer { width: 100%; height: 100px; }
    #macdLabel {
      position: absolute;
      top: 4px; left: 8px;
      font-size: 9px;
      color: rgba(200,209,217,0.45);
      pointer-events: none;
      z-index: 5;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    /* RSI panel */
    #rsiPanel {
      position: relative;
      width: 100%;
      border-top: 1px solid var(--border);
    }
    #rsiContainer { width: 100%; height: 90px; }
    #rsiLabel {
      position: absolute;
      top: 4px; left: 8px;
      font-size: 9px;
      color: rgba(200,209,217,0.45);
      pointer-events: none;
      z-index: 5;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    #chartLoading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 460px;
      color: var(--text-muted);
      font-size: 0.9rem;
      gap: 10px;
    }

    .chart-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chart-toolbar-left {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .chart-tool-btns {
      display: flex;
      gap: 6px;
    }

    .tool-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tool-btn:hover { color: var(--text); border-color: var(--accent); }
    .tool-btn.active { background: rgba(243,156,18,0.2); border-color: var(--yellow); color: var(--yellow); }

    tbody tr { cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>台灣上市股票篩選器</h1>
    <span>TWSE</span>
  </header>

  <div class="form-wrap">
    <div class="card">
      <div class="form-grid">
        <!-- 日期 -->
        <div class="field">
          <label>篩選日期</label>
          <div class="label-hint">空白 = 最新交易日；可輸入歷史日期</div>
          <input type="date" id="date" />
        </div>

        <!-- 長紅棒 -->
        <div class="field">
          <label>長紅棒幅度 (%)</label>
          <div class="label-hint">(收 - 開) / 開 × 100 ≥ 此值</div>
          <input type="number" id="red_candle_pct" min="0" max="20" step="0.1" placeholder="例：3（代表 3%）" />
        </div>

        <!-- 放量倍數 -->
        <div class="field">
          <label>放量倍數</label>
          <div class="label-hint">昨日 max(5日均量, 10日均量) × 倍數</div>
          <input type="number" id="volume_multiplier" min="0" step="0.1" placeholder="例：1.5（代表 1.5 倍）" />
        </div>

        <!-- 複選框 -->
        <div class="field">
          <label>額外條件</label>
          <div class="label-hint">&nbsp;</div>
          <div class="checkboxes">
            <label class="checkbox-row">
              <input type="checkbox" id="limit_up" />
              <div>
                <div class="cb-label">漲停板</div>
                <div class="cb-hint">當日收盤達漲停價（+10%）</div>
              </div>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="gap_up" />
              <div>
                <div class="cb-label">跳空向上</div>
                <div class="cb-hint">當日開盤 &gt; 前日最高</div>
              </div>
            </label>
          </div>
        </div>

        <!-- 按鈕 -->
        <div class="field">
          <label>&nbsp;</label>
          <div class="label-hint">&nbsp;</div>
          <button class="btn-submit" id="submitBtn" onclick="doScreen()">
            開始篩選
          </button>
        </div>
      </div>
      <div id="dataDateDisplay" style="margin-top:12px;font-size:0.78rem;color:var(--text-muted);"></div>
    </div>
  </div>

  <!-- 指數快覽 -->
  <div class="index-row">
    <span class="index-row-label">指數快覽</span>
    <button class="idx-btn" onclick="openIndexChart('^TWII','大盤 加權指數')">大盤</button>
    <button class="idx-btn" onclick="openIndexChart('TX=F','台指期貨')">台指期</button>
    <button class="idx-btn" onclick="openIndexChart('^N225','日經 225')">日經225</button>
    <button class="idx-btn" onclick="openIndexChart('^KS11','韓國 KOSPI')">KOSPI</button>
    <button class="idx-btn" onclick="openIndexChart('NQ=F','那斯達克 NQ 期貨')">NQ</button>
    <button class="idx-btn" onclick="openIndexChart('YM=F','道瓊 YM 期貨')">YM</button>
  </div>

  <div class="results-wrap">
    <div id="statusArea"></div>
    <div id="resultsArea"></div>
  </div>

  <!-- K線圖 Modal -->
  <div class="modal-overlay" id="chartModal" onclick="closeChartIfBg(event)">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle">—</div>
          <div class="modal-subtitle" id="modalSubtitle">日K線</div>
        </div>
        <button class="modal-close" onclick="closeChart()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="chart-toolbar">
          <div class="chart-toolbar-left">
            <div class="chart-range-btns" id="rangeBtns">
              <button class="range-btn" onclick="loadChart('1mo')">1月</button>
              <button class="range-btn active" onclick="loadChart('3mo')">3月</button>
              <button class="range-btn" onclick="loadChart('6mo')">6月</button>
              <button class="range-btn" onclick="loadChart('1y')">1年</button>
            </div>
            <div class="toolbar-sep"></div>
            <div style="display:flex;gap:4px">
              <button class="range-btn active" id="intDayBtn" onclick="switchInterval('1d')">日K</button>
              <button class="range-btn" id="int5mBtn" onclick="switchInterval('5m')">5分K</button>
            </div>
            <div class="toolbar-sep"></div>
            <button class="tool-btn" onclick="openMarketChart()">大盤K</button>
            <button class="tool-btn" id="backBtn" style="display:none" onclick="goBackToStock()">← 返回</button>
          </div>
          <div class="chart-tool-btns">
            <button class="tool-btn" id="fibBtn" onclick="toggleFibMode()">📐 斐波那契</button>
            <button class="tool-btn" onclick="clearFib()">✕ 清除</button>
          </div>
        </div>
        <div id="chartLoading"><div class="spinner"></div> 載入中...</div>
        <div id="chartWrapper" style="display:none">
          <div id="mainChartPanel">
            <div id="chartContainer"></div>
            <canvas id="fibCanvas"></canvas>
            <div id="chartOverlay"></div>
            <div id="volLabel">VOL</div>
          </div>
          <div id="macdPanel">
            <div id="macdContainer"></div>
            <div id="macdLabel">MACD(12,26,9)</div>
          </div>
          <div id="rsiPanel">
            <div id="rsiContainer"></div>
            <div id="rsiLabel">RSI(14)</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let sortKey = 'candle_pct';
    let sortDir = -1;
    let lastResults = [];
    let hasVolFilter = false;

    function showStatus(html) {
      document.getElementById('statusArea').innerHTML = html;
    }

    function doScreen() {
      const dateVal = document.getElementById('date').value;
      const redPct = parseFloat(document.getElementById('red_candle_pct').value) || 0;
      const volMult = parseFloat(document.getElementById('volume_multiplier').value) || 0;
      const limitUp = document.getElementById('limit_up').checked;
      const gapUp = document.getElementById('gap_up').checked;
      hasVolFilter = volMult > 0;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> 資料載入中...';
      document.getElementById('resultsArea').innerHTML = '';
      document.getElementById('dataDateDisplay').textContent = '';

      const isHistorical = dateVal && dateVal.length > 0;
      let hint = isHistorical
        ? `正在透過 Yahoo Finance 取得 ${dateVal} 歷史資料，請稍候（約 10–20 秒）...`
        : '正在向台灣證交所取得最新交易日資料...';
      showStatus(`<div class="alert alert-info">&#8987; ${hint}</div>`);

      const body = {
        date: dateVal ? dateVal.replace(/-/g, '') : '',
        red_candle_pct: redPct,
        volume_multiplier: volMult,
        limit_up: limitUp,
        gap_up: gapUp,
      };

      fetch('/api/screen', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
        .then(r => r.json())
        .then(data => {
          btn.disabled = false;
          btn.innerHTML = '開始篩選';

          if (data.error) {
            showStatus(`<div class="alert alert-error">&#9888; ${data.error}</div>`);
            document.getElementById('resultsArea').innerHTML = '';
            return;
          }

          lastResults = data.results || [];
          renderResults(data);
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerHTML = '開始篩選';
          showStatus(`<div class="alert alert-error">&#9888; 連線錯誤：${err.message}</div>`);
        });
    }

    function renderResults(data) {
      const results = data.results || [];

      // Show actual data date returned from API
      if (data.date) {
        const dateInput = document.getElementById('date').value;
        const isHist = dateInput && dateInput.length > 0;
        document.getElementById('dataDateDisplay').textContent =
          isHist ? `資料來源：Yahoo Finance（${data.date}）` : `資料來源：證交所最新（${data.date}）`;
      }

      showStatus(`
        <div class="results-header">
          <div class="results-title">篩選結果 — ${data.date}</div>
          <div class="results-meta">
            符合條件 <strong>${data.count}</strong> 檔 ／ 全市場上市 ${data.total} 檔
          </div>
        </div>
      `);

      if (results.length === 0) {
        document.getElementById('resultsArea').innerHTML = `
          <div class="card">
            <div class="empty-state">
              <div class="icon">&#128269;</div>
              <p>沒有符合條件的個股</p>
            </div>
          </div>`;
        return;
      }

      renderTable(results);
    }

    function renderTable(results) {
      const sorted = [...results].sort((a, b) => {
        const av = a[sortKey] ?? -Infinity;
        const bv = b[sortKey] ?? -Infinity;
        return (av - bv) * sortDir;
      });

      const volCols = hasVolFilter ? `
        <th onclick="setSort('ma5_vol')" class="${sortKey==='ma5_vol'?'sorted':''}">5日均量(張)<span class="sort-arrow">${sortKey==='ma5_vol'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
        <th onclick="setSort('ma10_vol')" class="${sortKey==='ma10_vol'?'sorted':''}">10日均量(張)<span class="sort-arrow">${sortKey==='ma10_vol'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
        <th onclick="setSort('vol_ratio')" class="${sortKey==='vol_ratio'?'sorted':''}">放量倍數<span class="sort-arrow">${sortKey==='vol_ratio'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
      ` : '';

      const rows = sorted.map(s => {
        const changeCls = (s.change_pct ?? 0) > 0 ? 'positive' : (s.change_pct ?? 0) < 0 ? 'negative' : 'neutral';
        const candleCls = s.candle_pct > 0 ? 'positive' : s.candle_pct < 0 ? 'negative' : 'neutral';
        const changeStr = s.change_pct != null
          ? (s.change_pct > 0 ? `+${s.change_pct}%` : `${s.change_pct}%`)
          : '–';
        const candleStr = s.candle_pct > 0
          ? `+${s.candle_pct}%`
          : `${s.candle_pct}%`;

        const volCells = hasVolFilter ? `
          <td class="neutral">${s.ma5_vol != null ? Number(s.ma5_vol).toLocaleString() : '–'}</td>
          <td class="neutral">${s.ma10_vol != null ? Number(s.ma10_vol).toLocaleString() : '–'}</td>
          <td>${s.vol_ratio != null ? `<span class="badge badge-yellow">${s.vol_ratio}x</span>` : '–'}</td>
        ` : '';

        return `
          <tr onclick="openChart('${s.code}','${s.name.replace(/'/g,"\\'")}')">
            <td class="code-cell"><a href="https://www.twse.com.tw/zh/trading/historical/stock-day.html?stockNo=${s.code}" target="_blank" onclick="event.stopPropagation()">${s.code}</a></td>
            <td class="name-cell">${s.name}</td>
            <td class="neutral">${s.open}</td>
            <td class="neutral">${s.high}</td>
            <td class="neutral">${s.low}</td>
            <td class="${changeCls}">${s.close}</td>
            <td class="${changeCls}">${changeStr}</td>
            <td class="${candleCls}">${candleStr}</td>
            <td class="neutral">${Number(s.volume_lots).toLocaleString()} 張</td>
            ${volCells}
          </tr>`;
      }).join('');

      document.getElementById('resultsArea').innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th onclick="setSort('code')" class="${sortKey==='code'?'sorted':''}">代號<span class="sort-arrow">${sortKey==='code'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th>名稱</th>
                <th onclick="setSort('open')" class="${sortKey==='open'?'sorted':''}">開盤<span class="sort-arrow">${sortKey==='open'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('high')" class="${sortKey==='high'?'sorted':''}">最高<span class="sort-arrow">${sortKey==='high'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('low')" class="${sortKey==='low'?'sorted':''}">最低<span class="sort-arrow">${sortKey==='low'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('close')" class="${sortKey==='close'?'sorted':''}">收盤<span class="sort-arrow">${sortKey==='close'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('change_pct')" class="${sortKey==='change_pct'?'sorted':''}">漲跌幅<span class="sort-arrow">${sortKey==='change_pct'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('candle_pct')" class="${sortKey==='candle_pct'?'sorted':''}">紅棒幅度<span class="sort-arrow">${sortKey==='candle_pct'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                <th onclick="setSort('volume_lots')" class="${sortKey==='volume_lots'?'sorted':''}">成交量<span class="sort-arrow">${sortKey==='volume_lots'?(sortDir>0?'▲':'▼'):'↕'}</span></th>
                ${volCols}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function setSort(key) {
      if (sortKey === key) {
        sortDir *= -1;
      } else {
        sortKey = key;
        sortDir = -1;
      }
      if (lastResults.length > 0) renderTable(lastResults);
    }

    // Allow pressing Enter to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !document.getElementById('submitBtn').disabled) doScreen();
      if (e.key === 'Escape') closeChart();
    });

    // ── K線圖 state ─────────────────────────────────────────
    let currentCode = '';
    let currentName = '';
    let currentInterval = '1d';
    let currentRange = '3mo';
    let prevCode = '';
    let prevName = '';
    let chartInstance = null;
    let macdInstance = null;
    let rsiInstance = null;
    let candleSeriesRef = null;
    let fibMode = false;
    let fibLines = [];
    let fibDragStart = null;
    let fibSetupDone = false;

    const RANGE_OPTS = {
      '1d': [{ l:'1月', v:'1mo' }, { l:'3月', v:'3mo' }, { l:'6月', v:'6mo' }, { l:'1年', v:'1y' }],
      '5m': [{ l:'今日', v:'1d' }, { l:'5日', v:'5d' }],
    };

    // ── Open / close ──────────────────────────────────────
    function openChart(code, name) {
      prevCode = ''; prevName = '';
      currentCode = code;
      currentName = name;
      currentInterval = '1d';
      currentRange = '3mo';
      document.getElementById('modalTitle').textContent = `${code}　${name}`;
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('chartModal').classList.add('open');
      _setIntervalUI('1d');
      if (!fibSetupDone) { setupFibOverlay(); fibSetupDone = true; }
      loadChart('3mo');
    }

    function openIndexChart(sym, name) {
      prevCode = ''; prevName = '';
      currentCode = sym;
      currentName = name;
      currentInterval = '1d';
      currentRange = '3mo';
      document.getElementById('modalTitle').textContent = name;
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('chartModal').classList.add('open');
      _setIntervalUI('1d');
      if (!fibSetupDone) { setupFibOverlay(); fibSetupDone = true; }
      loadChart('3mo');
    }

    function openMarketChart() {
      if (currentCode && !currentCode.startsWith('^') && currentCode !== '') {
        prevCode = currentCode;
        prevName = document.getElementById('modalTitle').textContent;
      }
      currentCode = '^TWII';
      currentName = '大盤 加權指數';
      currentInterval = '1d';
      currentRange = '3mo';
      document.getElementById('modalTitle').textContent = '大盤 加權指數';
      document.getElementById('backBtn').style.display = prevCode ? 'inline-block' : 'none';
      _setIntervalUI('1d');
      loadChart('3mo');
    }

    function goBackToStock() {
      if (!prevCode) return;
      currentCode = prevCode;
      document.getElementById('modalTitle').textContent = prevName;
      document.getElementById('backBtn').style.display = 'none';
      prevCode = ''; prevName = '';
      _setIntervalUI(currentInterval);
      loadChart(currentRange);
    }

    function closeChart() {
      document.getElementById('chartModal').classList.remove('open');
      _destroyCharts();
      fibLines = [];
      fibMode = false;
      fibDragStart = null;
      document.getElementById('fibBtn').classList.remove('active');
      document.getElementById('chartOverlay').style.display = 'none';
    }

    function closeChartIfBg(e) {
      if (e.target === document.getElementById('chartModal')) closeChart();
    }

    function _destroyCharts() {
      if (chartInstance) { chartInstance.remove(); chartInstance = null; }
      if (macdInstance)  { macdInstance.remove();  macdInstance = null; }
      if (rsiInstance)   { rsiInstance.remove();   rsiInstance = null; }
      candleSeriesRef = null;
    }

    // ── Interval & range switching ─────────────────────────
    function switchInterval(iv) {
      currentInterval = iv;
      _setIntervalUI(iv);
      const defaultRange = iv === '5m' ? '1d' : '3mo';
      currentRange = defaultRange;
      loadChart(defaultRange);
    }

    function _setIntervalUI(iv) {
      document.getElementById('intDayBtn').classList.toggle('active', iv === '1d');
      document.getElementById('int5mBtn').classList.toggle('active', iv === '5m');
      // Fib only meaningful on daily
      document.getElementById('fibBtn').style.display = iv === '1d' ? '' : 'none';
      _rebuildRangeBtns(iv, iv === '5m' ? '1d' : currentRange);
    }

    function _rebuildRangeBtns(iv, activeV) {
      const container = document.getElementById('rangeBtns');
      container.innerHTML = RANGE_OPTS[iv].map(o =>
        `<button class="range-btn${o.v === activeV ? ' active' : ''}" onclick="loadChart('${o.v}')">${o.l}</button>`
      ).join('');
    }

    // ── Load chart data ────────────────────────────────────
    function loadChart(range) {
      currentRange = range;
      _rebuildRangeBtns(currentInterval, range);

      document.getElementById('chartLoading').style.display = 'flex';
      document.getElementById('chartWrapper').style.display = 'none';

      _destroyCharts();
      fibLines = [];
      fibMode = false;
      fibDragStart = null;
      document.getElementById('fibBtn').classList.remove('active');
      document.getElementById('chartOverlay').style.display = 'none';
      clearFibCanvas();

      const url = `/api/chart?code=${encodeURIComponent(currentCode)}&range=${range}&interval=${currentInterval}`;
      fetch(url)
        .then(r => r.json())
        .then(data => {
          if (data.error || !data.data || data.data.length === 0) {
            document.getElementById('chartLoading').innerHTML = '⚠ 無法取得圖表資料';
            return;
          }
          const first = data.data[0].time;
          const last  = data.data[data.data.length - 1].time;
          const ivLabel = currentInterval === '5m' ? '5分K' : '日K';
          const timeRange = typeof first === 'number'
            ? new Date(last * 1000).toLocaleDateString('zh-TW')
            : `${first} ～ ${last}`;
          document.getElementById('modalSubtitle').textContent = `${ivLabel} ・ ${timeRange}`;
          renderTVChart(data.data);
        })
        .catch(() => {
          document.getElementById('chartLoading').innerHTML = '⚠ 載入失敗，請重試';
        });
    }

    // ── Technical indicator calculations ──────────────────
    function calcEMA(values, period) {
      const res = new Array(values.length).fill(null);
      if (values.length < period) return res;
      const k = 2 / (period + 1);
      let sum = 0;
      for (let i = 0; i < period; i++) sum += values[i];
      res[period - 1] = sum / period;
      for (let i = period; i < values.length; i++) {
        res[i] = values[i] * k + res[i - 1] * (1 - k);
      }
      return res;
    }

    function calcMACD(closes) {
      const ema12 = calcEMA(closes, 12);
      const ema26 = calcEMA(closes, 26);
      const macdLine = closes.map((_, i) =>
        ema12[i] !== null && ema26[i] !== null ? ema12[i] - ema26[i] : null
      );
      // Signal = EMA9 of macdLine (computed on valid values only, then re-aligned)
      const validVals = [], validIdx = [];
      macdLine.forEach((v, i) => { if (v !== null) { validVals.push(v); validIdx.push(i); } });
      const sigVals = calcEMA(validVals, 9);
      const sigLine = new Array(closes.length).fill(null);
      sigVals.forEach((v, i) => { sigLine[validIdx[i]] = v; });
      const hist = closes.map((_, i) =>
        macdLine[i] !== null && sigLine[i] !== null ? macdLine[i] - sigLine[i] : null
      );
      return { macd: macdLine, signal: sigLine, hist };
    }

    function calcRSI(closes, period = 14) {
      const res = new Array(closes.length).fill(null);
      if (closes.length < period + 1) return res;
      let avgG = 0, avgL = 0;
      for (let i = 1; i <= period; i++) {
        const d = closes[i] - closes[i - 1];
        if (d > 0) avgG += d; else avgL -= d;
      }
      avgG /= period; avgL /= period;
      res[period] = 100 - 100 / (1 + (avgL > 0 ? avgG / avgL : Infinity));
      for (let i = period + 1; i < closes.length; i++) {
        const d = closes[i] - closes[i - 1];
        avgG = (avgG * (period - 1) + Math.max(d, 0)) / period;
        avgL = (avgL * (period - 1) + Math.max(-d, 0)) / period;
        res[i] = 100 - 100 / (1 + (avgL > 0 ? avgG / avgL : Infinity));
      }
      return res;
    }

    // ── Render all chart panels ───────────────────────────
    function renderTVChart(candles) {
      document.getElementById('chartLoading').style.display = 'none';
      document.getElementById('chartWrapper').style.display = 'block';

      _renderMainChart(candles);
      _renderMACDChart(candles);
      _renderRSIChart(candles);

      // Sync time scales across all three panels
      _syncTimeRanges([chartInstance, macdInstance, rsiInstance].filter(Boolean));

      resizeFibCanvas();

      const mainEl = document.getElementById('chartContainer');
      new ResizeObserver(() => {
        if (chartInstance) chartInstance.applyOptions({ width: mainEl.clientWidth });
        if (macdInstance)  macdInstance.applyOptions({ width: document.getElementById('macdContainer').clientWidth });
        if (rsiInstance)   rsiInstance.applyOptions({ width: document.getElementById('rsiContainer').clientWidth });
        resizeFibCanvas();
      }).observe(mainEl);
    }

    function _chartOpts(height, showTime) {
      return {
        width: 0,
        height,
        layout: { background: { color: '#131722' }, textColor: '#c9d1d9' },
        grid: { vertLines: { color: '#2e3350' }, horzLines: { color: '#2e3350' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2e3350' },
        timeScale: { borderColor: '#2e3350', timeVisible: true, visible: showTime, secondsVisible: false },
        handleScroll: true,
        handleScale: true,
      };
    }

    function _renderMainChart(candles) {
      const el = document.getElementById('chartContainer');
      el.innerHTML = '';
      const opts = _chartOpts(270, false);
      opts.width = el.clientWidth;
      chartInstance = LightweightCharts.createChart(el, opts);

      candleSeriesRef = chartInstance.addCandlestickSeries({
        upColor: '#e74c3c', downColor: '#26c281',
        borderUpColor: '#e74c3c', borderDownColor: '#26c281',
        wickUpColor: '#e74c3c', wickDownColor: '#26c281',
      });
      candleSeriesRef.setData(candles);

      const volSeries = chartInstance.addHistogramSeries({
        priceFormat: { type: 'volume' }, priceScaleId: 'vol',
      });
      chartInstance.priceScale('vol').applyOptions({ scaleMargins: { top: 0.75, bottom: 0 } });
      volSeries.setData(candles.map(c => ({
        time: c.time, value: c.volume,
        color: c.close >= c.open ? 'rgba(231,76,60,0.4)' : 'rgba(38,194,129,0.4)',
      })));

      chartInstance.timeScale().fitContent();
    }

    function _renderMACDChart(candles) {
      const el = document.getElementById('macdContainer');
      el.innerHTML = '';
      const closes = candles.map(c => c.close);
      const times  = candles.map(c => c.time);
      const { macd, signal, hist } = calcMACD(closes);

      const opts = _chartOpts(100, false);
      opts.width = el.clientWidth;
      opts.rightPriceScale.scaleMargins = { top: 0.1, bottom: 0.1 };
      macdInstance = LightweightCharts.createChart(el, opts);

      // Histogram
      const histSeries = macdInstance.addHistogramSeries({ priceScaleId: 'right', lineWidth: 1 });
      histSeries.setData(
        times.map((t, i) => hist[i] !== null ? {
          time: t, value: hist[i],
          color: hist[i] >= 0 ? 'rgba(231,76,60,0.65)' : 'rgba(38,194,129,0.65)',
        } : null).filter(Boolean)
      );

      // MACD line
      const macdSeries = macdInstance.addLineSeries({ color: '#4f8ef7', lineWidth: 1, priceScaleId: 'right' });
      macdSeries.setData(times.map((t, i) => macd[i] !== null ? { time: t, value: macd[i] } : null).filter(Boolean));

      // Signal line
      const sigSeries = macdInstance.addLineSeries({ color: '#f39c12', lineWidth: 1, priceScaleId: 'right' });
      sigSeries.setData(times.map((t, i) => signal[i] !== null ? { time: t, value: signal[i] } : null).filter(Boolean));

      // Zero reference
      macdSeries.createPriceLine({
        price: 0, color: 'rgba(200,209,217,0.25)', lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false,
      });

      macdInstance.timeScale().fitContent();
    }

    function _renderRSIChart(candles) {
      const el = document.getElementById('rsiContainer');
      el.innerHTML = '';
      const closes = candles.map(c => c.close);
      const times  = candles.map(c => c.time);
      const rsi = calcRSI(closes);

      const opts = _chartOpts(90, true);
      opts.width = el.clientWidth;
      opts.rightPriceScale.scaleMargins = { top: 0.05, bottom: 0.05 };
      rsiInstance = LightweightCharts.createChart(el, opts);

      const rsiSeries = rsiInstance.addLineSeries({
        color: '#9b59b6', lineWidth: 1, priceScaleId: 'right',
        autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }),
      });
      rsiSeries.setData(times.map((t, i) => rsi[i] !== null ? { time: t, value: rsi[i] } : null).filter(Boolean));

      // Reference lines
      [{ p: 70, c: 'rgba(231,76,60,0.4)' }, { p: 50, c: 'rgba(200,209,217,0.2)' }, { p: 30, c: 'rgba(38,194,129,0.4)' }]
        .forEach(({ p, c }) => rsiSeries.createPriceLine({
          price: p, color: c, lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '',
        }));

      rsiInstance.timeScale().fitContent();
    }

    function _syncTimeRanges(charts) {
      let syncing = false;
      charts.forEach(src => {
        src.timeScale().subscribeVisibleLogicalRangeChange(range => {
          if (syncing || !range) return;
          syncing = true;
          charts.forEach(tgt => { if (tgt !== src) tgt.timeScale().setVisibleLogicalRange(range); });
          syncing = false;
        });
      });
    }

    // ── Fibonacci Retracement ──────────────────────────────
    function resizeFibCanvas() {
      const canvas = document.getElementById('fibCanvas');
      const panel  = document.getElementById('mainChartPanel');
      if (!canvas || !panel) return;
      canvas.width  = panel.clientWidth;
      canvas.height = panel.clientHeight;
    }

    function clearFibCanvas() {
      const canvas = document.getElementById('fibCanvas');
      if (!canvas) return;
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    function setupFibOverlay() {
      const overlay = document.getElementById('chartOverlay');
      const canvas  = document.getElementById('fibCanvas');

      function getY(clientY) { return clientY - overlay.getBoundingClientRect().top; }

      function drawBand(y0, y1) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const minY = Math.min(y0, y1), h = Math.abs(y1 - y0);
        ctx.fillStyle = 'rgba(243,156,18,0.08)';
        ctx.fillRect(0, minY, canvas.width, h);
        ctx.strokeStyle = 'rgba(243,156,18,0.55)';
        ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
        ctx.strokeRect(0, minY, canvas.width, h);
        ctx.setLineDash([]);
      }

      function finishFib(endY) {
        if (!fibDragStart || !candleSeriesRef) { fibDragStart = null; return; }
        const p2 = candleSeriesRef.coordinateToPrice(endY);
        if (p2 == null) { fibDragStart = null; return; }
        const high = Math.max(fibDragStart.price, p2);
        const low  = Math.min(fibDragStart.price, p2);
        if (high !== low) drawFibLines(high, low);
        clearFibCanvas();
        fibDragStart = null; fibMode = false;
        document.getElementById('fibBtn').classList.remove('active');
        overlay.style.display = 'none';
      }

      overlay.addEventListener('mousedown', e => {
        if (!candleSeriesRef) return;
        const y = getY(e.clientY);
        const price = candleSeriesRef.coordinateToPrice(y);
        if (price == null) return;
        fibDragStart = { y, price };
      });
      overlay.addEventListener('mousemove', e => { if (fibDragStart) drawBand(fibDragStart.y, getY(e.clientY)); });
      overlay.addEventListener('mouseup', e => { finishFib(getY(e.clientY)); });

      overlay.addEventListener('touchstart', e => {
        if (!candleSeriesRef) return; e.preventDefault();
        const y = getY(e.touches[0].clientY);
        const price = candleSeriesRef.coordinateToPrice(y);
        if (price == null) return;
        fibDragStart = { y, price };
      }, { passive: false });
      overlay.addEventListener('touchmove', e => {
        if (!fibDragStart) return; e.preventDefault();
        drawBand(fibDragStart.y, getY(e.touches[0].clientY));
      }, { passive: false });
      overlay.addEventListener('touchend', e => {
        e.preventDefault(); finishFib(getY(e.changedTouches[0].clientY));
      }, { passive: false });
    }

    function toggleFibMode() {
      if (!chartInstance) return;
      fibMode = !fibMode;
      document.getElementById('fibBtn').classList.toggle('active', fibMode);
      document.getElementById('chartOverlay').style.display = fibMode ? 'block' : 'none';
      if (!fibMode) { fibDragStart = null; clearFibCanvas(); }
    }

    function clearFib() {
      fibLines.forEach(pl => {
        try { if (candleSeriesRef) candleSeriesRef.removePriceLine(pl); } catch(e) {}
      });
      fibLines = []; fibDragStart = null; clearFibCanvas();
    }

    function drawFibLines(high, low) {
      if (!candleSeriesRef) return;
      clearFib();
      const range = high - low;
      [
        { ratio: 0,     label: '0%',    color: '#e74c3c' },
        { ratio: 0.236, label: '23.6%', color: '#f39c12' },
        { ratio: 0.382, label: '38.2%', color: '#2ecc71' },
        { ratio: 0.5,   label: '50%',   color: '#4f8ef7' },
        { ratio: 0.618, label: '61.8%', color: '#9b59b6' },
        { ratio: 1,     label: '100%',  color: '#e74c3c' },
      ].forEach(({ ratio, label, color }) => {
        const price = parseFloat((high - range * ratio).toFixed(2));
        fibLines.push(candleSeriesRef.createPriceLine({
          price, color, lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: `Fib ${label}  ${price}`,
        }));
      });
    }
  </script>
