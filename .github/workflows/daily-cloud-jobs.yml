name: daily-cloud-jobs

# 把 3 支「純網路抓取 → 上傳 Supabase」的每日排程搬到 GitHub 伺服器，
# 讓本機電腦沒開時這些資料照樣每天更新。
#   - catalyst_lawshow.py    法說會行事曆 → catalyst_events
#   - upload_exdiv_factor.py 除權息還原因子 → exdiv_factor
#   - margin_ratio.py        大盤融資維持率 → margin_maintenance
# 這 3 支只用 Python 標準庫，不需 pip 安裝；密鑰由 repo Secrets 提供。
#
# 註：排程(schedule)只會從「預設分支(prod)」觸發，此檔必須在 prod 上才會定時跑。

on:
  schedule:
    - cron: '30 12 * * 1-5'   # UTC 12:30 = 台灣 20:30，週一~週五（盤後）
  workflow_dispatch: {}        # 允許在 Actions 頁面手動觸發（測試用）

env:
  SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY:    ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 法說會行事曆（catalyst_lawshow）
        run: python scripts/catalyst_lawshow.py

      - name: 除權息還原因子（upload_exdiv_factor）
        if: ${{ !cancelled() }}      # 前一步失敗也照跑，彼此獨立
        run: python scripts/upload_exdiv_factor.py

      - name: 大盤融資維持率（margin_ratio）
        if: ${{ !cancelled() }}
        run: python scripts/margin_ratio.py
