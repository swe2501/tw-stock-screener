name: daily-cloud-jobs

# 把 2 支「純網路抓取 → 上傳 Supabase」的每日排程搬到 GitHub 伺服器，
# 讓本機電腦沒開時這些資料照樣每天更新。
#   - catalyst_lawshow.py    法說會行事曆 → catalyst_events
#   - upload_exdiv_factor.py 除權息還原因子 → exdiv_factor
# 這 2 支只用 Python 標準庫，不需 pip 安裝；密鑰由 repo Secrets 提供。
#
# 註1：排程(schedule)只會從「預設分支(prod)」觸發，此檔必須在 prod 上才會定時跑。
# 註2：margin_ratio.py（大盤融資維持率）留在「本機」每日排程 —— 其資料源 wantgoo
#      會以 HTTP 403 封鎖 GitHub 雲端 IP，無法從雲端抓，故不搬上來。

on:
  schedule:
    - cron: '30 12 * * 1-5'   # UTC 12:30 = 台灣 20:30，週一~週五（盤後）
  workflow_dispatch: {}        # 允許在 Actions 頁面手動觸發（測試用）

env:
  SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY:    ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 法說會行事曆（catalyst_lawshow）
        run: python scripts/catalyst_lawshow.py

      - name: 除權息還原因子（upload_exdiv_factor）
        if: ${{ !cancelled() }}      # 前一步失敗也照跑，彼此獨立
        run: python scripts/upload_exdiv_factor.py

      # --- Phase 1 第一小批（2026-10-18）：純官方源→Supabase，測 GitHub IP 抓 TWSE/TPEX/TAIFEX 是否被限流 ---
      # 這 3 支不碰 wantgoo、不讀本機 SQLite，import broker_signals 僅取 env(雲端走 Secrets)。
      - name: 三大法人大盤（inst_market · TWSE）
        if: ${{ !cancelled() }}
        run: python scripts/inst_market.py

      - name: 櫃買指數（fetch_otc_index · TPEX）
        if: ${{ !cancelled() }}
        run: python scripts/fetch_otc_index.py --daily

      - name: 選擇權大盤（options_market · TAIFEX）
        if: ${{ !cancelled() }}
        run: python scripts/options_market.py

      # --- Phase 1 第二小批（2026-10-18）：同為純官方源→Supabase，0 本機依賴 ---
      - name: 類股成交（sector_turnover · TWSE）
        if: ${{ !cancelled() }}
        run: python scripts/sector_turnover.py

      - name: 融資融券大盤（margin_market · TWSE）
        if: ${{ !cancelled() }}
        run: python scripts/margin_market.py

      - name: 期貨大盤（futures_market · TAIFEX）
        if: ${{ !cancelled() }}
        run: python scripts/futures_market.py

      - name: 基本面（fundamentals · TWSE/TPEX）
        if: ${{ !cancelled() }}
        run: python scripts/fundamentals.py

      # --- Phase 1 第三批（2026-10-18）：剩餘純官方源/Supabase，0 本機依賴 ---
      # 註：page_cache_push、job_health 吃 Supabase 既有資料；在雲端僅跑部分管線時其輸入可能偏舊，屬資料新鮮度（非雲端可跑性）議題。
      - name: 上市櫃代碼（gen_listed_codes）
        if: ${{ !cancelled() }}
        run: python scripts/gen_listed_codes.py
      - name: 美債殖利率（ust_yields_push · 美財政部）
        if: ${{ !cancelled() }}
        run: python scripts/ust_yields_push.py
      - name: ETF 清單（upload_etf · TWSE/TPEX）
        if: ${{ !cancelled() }}
        run: python scripts/upload_etf.py
      - name: ETF 配息（upload_etf_div · TWSE）
        if: ${{ !cancelled() }}
        run: python scripts/upload_etf_div.py
      - name: ETF 持有人（upload_etf_holders）
        if: ${{ !cancelled() }}
        run: python scripts/upload_etf_holders.py
      - name: 主動式 ETF 持股（upload_active_etf_holdings）
        if: ${{ !cancelled() }}
        run: python scripts/upload_active_etf_holdings.py
      - name: 主動式 ETF 流（active_etf_flow）
        if: ${{ !cancelled() }}
        run: python scripts/active_etf_flow.py
      - name: 機構法人（upload_institutional · TWSE）
        if: ${{ !cancelled() }}
        run: python scripts/upload_institutional.py
      - name: 籌碼摘要（chip_brief · TWSE/TPEX/TAIFEX）
        if: ${{ !cancelled() }}
        run: python scripts/chip_brief.py
      - name: 外資避險（foreign_hedge · TWSE/TAIFEX）
        if: ${{ !cancelled() }}
        run: python scripts/foreign_hedge.py
      - name: 流動性排行（liquidity_top · TWSE/TAIFEX）
        if: ${{ !cancelled() }}
        run: python scripts/liquidity_top.py
      - name: MOPS 公告（mops_announce · TWSE/TPEX）
        if: ${{ !cancelled() }}
        run: python scripts/mops_announce.py
      - name: 大盤廣度（breadth_daily）
        if: ${{ !cancelled() }}
        run: python scripts/breadth_daily.py
      - name: 政府基金分點（gov_broker_moneylink）
        if: ${{ !cancelled() }}
        run: python scripts/gov_broker_moneylink.py
      - name: 新聞（news_feed · TWSE/TPEX）
        if: ${{ !cancelled() }}
        run: python scripts/news_feed.py
      - name: 每日標語（daily_slogan_rotate）
        if: ${{ !cancelled() }}
        run: python scripts/daily_slogan_rotate.py
      # page_cache_push：末端聚合，需完整管線資料；資料湖未上雲前不在雲端跑（Phase 2）。
      # upload_hot_topics：需本機產生的 scripts/hot_topics.json（有本機相依）→ 留本機。
      - name: 排程健康檢查（job_health）
        if: ${{ !cancelled() }}
        run: python scripts/job_health.py
