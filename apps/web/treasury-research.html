    async function choose(code,name){
      var id=++token;el('ustMatches').textContent='取得標的資料…';
      try{
        var result={name:code+' '+name,yield:null,date:null,method:'目前沒有此指數的官方股息殖利率資料，未以 ETF 替代。'};
        var known=crossCatalog.find(function(x){return x[0]===code;});
        if(known){result.type=known[2];result.method=known[2]==='商品'?'原物料現貨／期貨沒有股息殖利率，不能直接計算息差。可在跨資產情境研究閱讀利率、美元與供需風險。':known[2]==='指數'?'此指數股息殖利率來源尚未接齊；不可用追蹤 ETF 替代。':'已收錄商品搜尋；該商品最新收益率來源尚未接齊，暫不計算利差。';}

            var product=data[0][0]||{},ds=data[1];var today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});var end=product.trade_date||product.date||today;var lower=new Date(end+'T00:00:00Z');lower.setUTCFullYear(lower.getUTCFullYear()-1);var lo=lower.toISOString().slice(0,10);var paid=ds.filter(function(d){return d.ex_date>lo&&d.ex_date<=end;});
            var sum=paid.reduce(function(n,d){return n+(d.cash_per_unit!=null?+d.cash_per_unit:0);},0);
            var complete=paid.length&&paid.every(function(d){return d.cash_per_unit!=null&&Number.isFinite(+d.cash_per_unit);});
            result.yield=product.close>0&&complete?sum/product.close*100:null;result.date=product.trade_date||product.date||null;
            result.method='歷史現金殖利率：近12個月已除息配息合計 '+sum.toFixed(2)+' 元 ÷ 收盤價 '+(product.close||'未提供')+'。窗口 '+lo+' 至 '+end+'；僅依本站已收錄配息，缺漏不補零。'+(!result.date?'收盤日期未提供，資料新鮮度尚無法確認。':'');

            result.method='本站收錄的官方個股殖利率口徑；可能包含特定股票股利，與 ETF 純現金配息口徑不同。不是預測殖利率。';
          }
        }
        if(id!==token)return;result.code=code;result.type=result.type||(code.startsWith('00')?'ETF':'個股');selected=result;el('ustMatches').textContent='';update();
      }catch(e){if(id===token)el('ustMatches').textContent='資料暫無法取得，請稍後重試。';}
    }
    function suggestions(){
      var term=el('ustQuery').value.trim().toLowerCase(),pool=[],seen={};
      function add(code,name,type){if(seen[code])return;seen[code]=1;if((code+' '+name).toLowerCase().includes(term))pool.push({code:code,name:name,type:type});}
      if(term){crossCatalog.forEach(function(x){if((x.join(' ')).toLowerCase().includes(term)){seen[x[0]]=1;pool.push({code:x[0],name:x[1],type:x[2]});}});products.forEach(function(x){add(x.code,x.name,'ETF');});Object.keys(window._names||{}).forEach(function(c){add(c,window._names[c],c.startsWith('00')?'ETF':'個股');});}
      return pool.sort(function(a,b){return (b.code.toLowerCase()===term)-(a.code.toLowerCase()===term)||a.code.localeCompare(b.code);}).slice(0,8);
    }
    function drawSuggestions(){var hits=suggestions();el('ustQuery').setAttribute('aria-expanded',hits.length?'true':'false');el('ustMatches').innerHTML=hits.map(function(x){return '<button type="button" role="option" aria-selected="false" data-code="'+esc(x.code)+'" data-name="'+esc(x.name)+'"><b>'+esc(x.code)+'</b><span>'+esc(x.name)+'<em>'+esc(describe(x.code,x.type)[0])+'</em></span><small>'+x.type+'</small></button>';}).join('');}

      fetch(API+'/api/screen?stat=treasury').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(d){if(!d.rates||!d.date)throw Error();rates=d.rates;rateDate=d.date;rateHistory=Array.isArray(d.history)?d.history:[];update();el('ustResearch10').value=rates['10y']!=null?rates['10y']:4.5;selectScenario(scenarioIndex);}).catch(function(){q('ust_yields?select=trade_date,y2,y10&order=trade_date.desc&limit=1').then(function(a){var d=a[0];if(d){rates={'10y':d.y10,'2y':d.y2};rateDate=d.trade_date;update();}}).catch(function(){update();});});
